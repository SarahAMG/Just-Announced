<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Just Announced</title>
<style>
:root{--blue:#0050ff;--bg:#f5f6fa;--text:#111;--muted:#686b73;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:22px 16px 42px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
h1{font-size:34px;line-height:1.02;letter-spacing:-1.3px;margin:0 0 8px}
.intro{font-size:15px;line-height:1.45;color:var(--muted);margin:0 0 18px}
.locationBar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:20px}
.locationLabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.locationValue{font-size:16px;font-weight:800;margin-top:2px}
button{font:inherit}.change{border:0;background:#eaf0ff;color:var(--blue);font-weight:800;border-radius:999px;padding:10px 13px;min-height:42px}
.picker{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:-8px 0 20px}
.picker h2{font-size:20px;margin:0 0 5px}.picker p{font-size:13px;color:var(--muted);margin:0 0 13px}
.cities{display:flex;flex-wrap:wrap;gap:8px}.city{border:1px solid #d8dbe2;background:#fff;border-radius:999px;padding:10px 13px;font-weight:700;min-height:42px}.city.active{background:var(--blue);border-color:var(--blue);color:#fff}
.hidden{display:none!important}.note{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.art{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e9ebf0}
.fallback{aspect-ratio:16/9;background:linear-gradient(135deg,#111,#343434);display:flex;align-items:flex-end;padding:18px;color:#fff;font-weight:900;font-size:24px}
.body{padding:16px}.new{display:inline-block;background:#eaf0ff;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:6px 9px;margin-bottom:8px}
.artist{font-size:23px;line-height:1.08;font-weight:900;letter-spacing:-.5px;margin:0 0 6px}
.meta{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:14px}
.ticket{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;font-size:14px}
.state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}.state strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}
.loader{height:4px;background:#dfe5f3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.loader:after{content:"";display:block;width:42%;height:100%;background:var(--blue);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}h1{font-size:42px}}

.backstageBack{
  position:relative;z-index:50;display:inline-flex;align-items:center;gap:7px;
  margin:14px 16px 0;padding:9px 12px;border:0;background:transparent;
  color:#0050ff;font-family:Arial,sans-serif;font-size:12px;font-weight:900;
  text-decoration:none;cursor:pointer
}
.backstageBack:hover{text-decoration:underline}

</style>

</style></head>
<script id="favourites-core">
(function(){
'use strict';
const SB='https://jiigtmxfepthdeorlnmv.supabase.co', KEY='sb_publishable_N37lWnFWPnDIRd7QBOEVpw_r13WPTyQ';
const SESSION='o2_favourites_auth_v2', LEGACY='o2-favourite-shows-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null, state={}, registry=new Map(), busy=false;
try{session=JSON.parse(localStorage.getItem(SESSION)||'null')}catch(e){}
const id=s=>String(s?.id??'').trim();
const record=s=>({id:id(s),artist:String(s.artist||''),city:String(s.city||''),venue:String(s.venue||s.venues?.name||''),date:String(s.event_date||s.date||'').slice(0,10),ticket_url:String(s.ticket_url||''),image_url:String(s.image_url||'')});
function notify(){updateHearts();window.dispatchEvent(new Event('o2-favourites-changed'));updateAccount()}
function active(){return Object.values(state).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}
function isSaved(s){return Boolean(state[id(s)])}
function heart(s){return `<button class="fav-heart" type="button" data-fav-id="${esc(id(s))}" aria-label="${isSaved(s)?'Remove from':'Add to'} favourites" aria-pressed="${isSaved(s)}" title="${isSaved(s)?'Remove from favourites':'Save show'}">${isSaved(s)?'♥':'♡'}</button>`}
function register(s){if(id(s))registry.set(id(s),s)}
function updateHearts(){document.querySelectorAll('[data-fav-id]').forEach(b=>{const on=isSaved({id:b.dataset.favId});b.textContent=on?'♥':'♡';b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Remove from favourites':'Add to favourites');b.title=on?'Remove from favourites':'Save show'})}
function headers(auth=true){return {'apikey':KEY,'Content-Type':'application/json',...(auth&&session?.access_token?{'Authorization':'Bearer '+session.access_token}:{})}}
function saveSession(s){session=s;try{if(s)localStorage.setItem(SESSION,JSON.stringify(s));else localStorage.removeItem(SESSION)}catch(e){}}
async function refresh(){if(!session?.refresh_token)return false;const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:headers(false),body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok){saveSession(null);return false}const j=await r.json();saveSession(j);return true}
async function request(path,options={},retry=true){if(session?.expires_at&&Date.now()/1000>session.expires_at-60)await refresh();let r=await fetch(SB+path,{...options,headers:{...headers(),...(options.headers||{})}});if(r.status===401&&retry&&await refresh())return request(path,options,false);return r}
async function load(){if(!session?.access_token){state={};notify();return}try{const r=await request('/rest/v1/show_favourites?select=show_id,show_data&order=created_at.desc');if(!r.ok)throw Error('Could not load favourites ('+r.status+')');const rows=await r.json();state=Object.fromEntries(rows.map(x=>[x.show_id,{...x.show_data,id:x.show_id}]));notify()}catch(e){console.error(e);message('Could not load favourites. Please retry.')}}
async function save(s){if(!session?.access_token){openAccount();message('Sign in to save shows across all pages.');return false}const x=record(s);if(!x.id)return false;const was=state[x.id];if(was)delete state[x.id];else state[x.id]=x;notify();try{const r=await request(was?'/rest/v1/show_favourites?show_id=eq.'+encodeURIComponent(x.id):'/rest/v1/show_favourites',{method:was?'DELETE':'POST',headers:was?{}:{'Prefer':'resolution=merge-duplicates,return=minimal'},...(was?{}:{body:JSON.stringify({user_id:session.user.id,show_id:x.id,show_data:x})})});if(!r.ok)throw Error('Saving failed ('+r.status+')');return !was}catch(e){if(was)state[x.id]=was;else delete state[x.id];notify();console.error(e);message('Could not save that show. Please try again.');return false}}
function message(s){let e=document.getElementById('favNotice');if(!e){e=document.createElement('div');e.id='favNotice';e.setAttribute('role','status');e.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:#111;color:white;border-radius:14px;padding:14px;z-index:2147483647;font:14px Arial;box-shadow:0 6px 25px #0003';document.body.append(e)}e.textContent=s;e.hidden=false;setTimeout(()=>e.hidden=true,5000)}
function updateAccount(){const b=document.getElementById('favAccountButton');if(b)b.textContent=session?.user?.email?'♥ My Favourites · '+active().length:'♡ Save shows · Sign in';const e=document.getElementById('favAccountEmail');if(e)e.textContent=session?.user?.email||'';const out=document.getElementById('favSignout');if(out)out.hidden=!session}
function openAccount(){const d=document.getElementById('favAccountDialog');if(d){d.hidden=false;updateAccount()}}
function closeAccount(){const d=document.getElementById('favAccountDialog');if(d)d.hidden=true}
function accountUI(){const wrap=document.createElement('div');wrap.innerHTML=`<style>#favAccountButton{position:fixed;right:14px;bottom:14px;z-index:9999;border:0;border-radius:40px;background:#0050ff;color:white;padding:13px 17px;font:800 12px Arial;box-shadow:0 5px 24px #0003;cursor:pointer}#favAccountDialog{position:fixed;inset:0;z-index:10000;background:#0008;display:grid;place-items:center;padding:16px}#favAccountDialog[hidden]{display:none}#favAccountPanel{width:min(420px,100%);background:white;color:#151515;border-radius:22px;padding:25px;font:14px Arial;box-shadow:0 14px 60px #0004}#favAccountPanel h2{margin:0 0 8px;font-size:25px}#favAccountPanel p{line-height:1.45;color:#666}#favAccountPanel input{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;margin:7px 0;font:inherit}#favAccountPanel button{cursor:pointer;border:0;border-radius:20px;padding:12px 16px;font-weight:800}#favSend,#favVerify{background:#0050ff;color:white;width:100%;margin-top:8px}#favAccountClose{float:right;background:#eee}#favSignout{margin-top:12px;background:#eee}</style><button id="favAccountButton" type="button">♡ Save shows · Sign in</button><div id="favAccountDialog" hidden><div id="favAccountPanel" role="dialog" aria-modal="true" aria-label="My Favourites account"><button id="favAccountClose" type="button" aria-label="Close">✕</button><h2>My Favourites ♥</h2><p>Sign in with your email to keep saved gigs together across Backstage, the quiz and discovery pages. You'll need to sign in once on each website.</p><div id="favAccountEmail"></div><form id="favEmailForm"><label for="favEmail">Email address</label><input id="favEmail" type="email" autocomplete="email" required placeholder="you@example.com"><button id="favSend" type="submit">Email me a code</button></form><form id="favCodeForm" hidden><label for="favCode">Enter the email code</label><input id="favCode" inputmode="numeric" autocomplete="one-time-code" required placeholder="6-digit code"><button id="favVerify" type="submit">Sign in</button></form><button id="favSignout" type="button" hidden>Sign out</button><p id="favAccountStatus" role="status"></p></div></div>`;document.body.append(wrap);document.getElementById('favAccountButton').onclick=openAccount;document.getElementById('favAccountClose').onclick=closeAccount;document.getElementById('favAccountDialog').addEventListener('click',e=>{if(e.target.id==='favAccountDialog')closeAccount()});const status=document.getElementById('favAccountStatus');document.getElementById('favEmailForm').onsubmit=async e=>{e.preventDefault();const email=document.getElementById('favEmail').value.trim();status.textContent='Sending code…';try{const r=await fetch(SB+'/auth/v1/otp',{method:'POST',headers:headers(false),body:JSON.stringify({email,create_user:true})});if(!r.ok)throw Error((await r.json().catch(()=>({}))).msg||'Could not send code');document.getElementById('favCodeForm').hidden=false;status.textContent='Check your email for the sign-in code. (Supabase must be configured to send a code, not just a magic link.)'}catch(err){status.textContent=err.message}};document.getElementById('favCodeForm').onsubmit=async e=>{e.preventDefault();status.textContent='Signing in…';try{const r=await fetch(SB+'/auth/v1/verify',{method:'POST',headers:headers(false),body:JSON.stringify({email:document.getElementById('favEmail').value.trim(),token:document.getElementById('favCode').value.trim(),type:'email'})});if(!r.ok)throw Error('Invalid or expired code');const s=await r.json();saveSession(s);await load();closeAccount();message('Signed in! Your favourites are ready.')}catch(err){status.textContent=err.message}};document.getElementById('favSignout').onclick=()=>{saveSession(null);state={};notify();closeAccount()};updateAccount()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fav-id]');if(!b)return;e.preventDefault();e.stopPropagation();const s=registry.get(b.dataset.favId)||state[b.dataset.favId];if(s)save(s)},true);
window.addEventListener('storage',e=>{if(e.key===SESSION){try{session=JSON.parse(e.newValue||'null')}catch(_){session=null}load()}});
window.O2Favourites={register,heart,save,active,isSaved,updateHearts,withFavourites:url=>url,esc,openAccount,load};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{accountUI();load()});else{accountUI();load()}
})();
</script><body>

<main>
<div class="eyebrow">Fresh on the lineup</div>
<h1>Just announced</h1>
<p class="intro">New shows have landed. See the latest gigs added near you before they slip off your radar.</p>

<div id="bar" class="locationBar hidden">
 <div><div class="locationLabel">Your location</div><div id="loc" class="locationValue"></div></div>
 <button id="change" class="change" type="button">Change</button>
</div>

<section id="picker" class="picker">
 <h2>Where do you want to see shows?</h2>
 <p>We'll remember this for your other discovery pages too.</p>
 <div id="cities" class="cities">Loading locations…</div>
</section>

<div id="loading" class="loader"></div>

<section id="shows" class="grid" aria-live="polite"></section>
</main>

<script>
const SB="https://jiigtmxfepthdeorlnmv.supabase.co",KEY="sb_publishable_N37lWnFWPnDIRd7QBOEVpw_r13WPTyQ",LOCATION_KEY="amg_saved_location_v1";
const DAYS_NEW=7;
let all=[],selected=null;
const $=id=>document.getElementById(id);let defaultArtistImage="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dateOnly(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function parseDate(s){if(!s)return null;let d=new Date(s);return isNaN(d)?null:d}
function eventDate(s){if(!s)return"";let [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function addedLabel(s){let d=parseDate(s);if(!d)return"New";let today=new Date();today.setHours(0,0,0,0);let x=new Date(d);x.setHours(0,0,0,0);let n=Math.max(0,Math.round((today-x)/86400000));return n===0?"Added today":n===1?"Added yesterday":`Added ${n} days ago`}

function choose(c){selected=c;try{localStorage.setItem(LOCATION_KEY,c)}catch(e){};$("loc").textContent=c;$("picker").classList.add("hidden");$("bar").classList.remove("hidden");render()}
function renderCities(){let cs=[...new Set(all.map(x=>x.city).filter(Boolean))].sort();$("cities").innerHTML=cs.map(c=>`<button type="button" class="city ${selected===c?"active":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")||"<span>No locations available.</span>";$("cities").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b.dataset.c))}

function render(){
 if(!selected)return;
 let list=all.filter(s=>s.city===selected).sort((a,b)=>String(b.first_seen).localeCompare(String(a.first_seen))||String(a.event_date).localeCompare(String(b.event_date)));
 $("note").textContent=`New shows added in the last ${DAYS_NEW} days · ${selected}`;
 $("note").classList.remove("hidden");
 if(!list.length){$("shows").innerHTML=`<div class="state"><strong>No new shows here yet</strong>There haven't been any newly added shows in ${esc(selected)} in the last ${DAYS_NEW} days. Try another location.</div>`;return}
 $("shows").innerHTML=list.map(s=>{
  let imageSrc=s.image_url||defaultArtistImage;let img=imageSrc?`<img class="art" src="${esc(imageSrc)}" alt="" loading="lazy" onerror="this.style.display=\'none\'">`:`<div class="fallback">${esc(s.artist||"Live music")}</div>`;
  window.O2Favourites.register(s);return `<article class="card" data-artist="${esc(s.artist||"")}" data-city="${esc(s.city||"")}">${img}<div class="body"><div class="fav-inline"><div class="new">${esc(addedLabel(s.first_seen))}</div>${window.O2Favourites.heart(s)}</div><h2 class="artist">${esc(s.artist||"Upcoming show")}</h2><div class="meta">${eventDate(s.event_date)} · ${esc(s.city||"")}</div>${s.ticket_url?`<a class="ticket" href="${esc(s.ticket_url)}" target="_blank" rel="noopener">FIND TICKETS →</a>`:""}</div></article>`;
 }).join("");
}

async function load(){
 try{const dr=await fetch(`${SB}/rest/v1/halloween_config?show_id=eq.__settings__&select=default_artist_image_url`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});if(dr.ok){const dj=await dr.json();defaultArtistImage=dj[0]?.default_artist_image_url||""}}catch(e){}
 try{
  let rows=[],from=0,cut=new Date();cut.setDate(cut.getDate()-(DAYS_NEW-1));cut.setHours(0,0,0,0);
  const cutISO=cut.toISOString();
  while(true){
   let url=`${SB}/rest/v1/shows?select=id,artist,city,event_date,ticket_url,image_url,venue_id,first_seen&event_date=gte.${dateOnly()}&first_seen=gte.${encodeURIComponent(cutISO)}&order=first_seen.desc&offset=${from}&limit=1000`;
   let r=await fetch(url,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});
   if(!r.ok)throw Error(await r.text());
   let x=await r.json();rows.push(...x);if(x.length<1000)break;from+=1000;
  }
  all=rows;$("loading").classList.add("hidden");
  try{selected=localStorage.getItem(LOCATION_KEY)}catch(e){}
  renderCities();
  if(selected&&all.some(x=>x.city===selected)){$("loc").textContent=selected;$("picker").classList.add("hidden");$("bar").classList.remove("hidden");render()}
 }catch(e){console.error(e);$("loading").classList.add("hidden");$("picker").classList.add("hidden");$("shows").innerHTML='<div class="state"><strong>We couldn’t load new shows</strong>Please try again shortly.</div>'}
}
$("change").onclick=()=>$("picker").classList.toggle("hidden");
async function trackPageEvent(eventType,extra={}){try{await fetch(`${SB}/rest/v1/page_analytics`,{method:"POST",headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({page_name:"just_announced",event_type:eventType,...extra})})}catch(e){console.warn("Analytics event not recorded",e)}}
document.addEventListener("click",e=>{const a=e.target.closest("a.ticket");if(a){const card=a.closest(".card");trackPageEvent("ticket_click",{artist:card?.dataset?.artist||null,city:card?.dataset?.city||selected||null})}});
trackPageEvent("page_view");
load();
</script>
