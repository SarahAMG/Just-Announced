<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Just Announced</title>
<style>
:root{--blue:#0050ff;--bg:#f5f6fa;--text:#111;--muted:#686b73;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:22px 16px 42px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
h1{font-size:34px;line-height:1.02;letter-spacing:-1.3px;margin:0 0 8px}
.intro{font-size:15px;line-height:1.45;color:var(--muted);margin:0 0 18px}
.locationBar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:20px}
.locationLabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.locationValue{font-size:16px;font-weight:800;margin-top:2px}
button{font:inherit}.change{border:0;background:#eaf0ff;color:var(--blue);font-weight:800;border-radius:999px;padding:10px 13px;min-height:42px}
.picker{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:-8px 0 20px}
.picker h2{font-size:20px;margin:0 0 5px}.picker p{font-size:13px;color:var(--muted);margin:0 0 13px}
.cities{display:flex;flex-wrap:wrap;gap:8px}.city{border:1px solid #d8dbe2;background:#fff;border-radius:999px;padding:10px 13px;font-weight:700;min-height:42px}.city.active{background:var(--blue);border-color:var(--blue);color:#fff}
.hidden{display:none!important}.note{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.art{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e9ebf0}
.fallback{aspect-ratio:16/9;background:linear-gradient(135deg,#111,#343434);display:flex;align-items:flex-end;padding:18px;color:#fff;font-weight:900;font-size:24px}
.body{padding:16px}.new{display:inline-block;background:#eaf0ff;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:6px 9px;margin-bottom:8px}
.artist{font-size:23px;line-height:1.08;font-weight:900;letter-spacing:-.5px;margin:0 0 6px}
.meta{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:14px}
.ticket{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;font-size:14px}
.state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}.state strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}
.loader{height:4px;background:#dfe5f3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.loader:after{content:"";display:block;width:42%;height:100%;background:var(--blue);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}h1{font-size:42px}}

.backstageBack{
  position:relative;z-index:50;display:inline-flex;align-items:center;gap:7px;
  margin:14px 16px 0;padding:9px 12px;border:0;background:transparent;
  color:#0050ff;font-family:Arial,sans-serif;font-size:12px;font-weight:900;
  text-decoration:none;cursor:pointer
}
.backstageBack:hover{text-decoration:underline}

</style>
<style id="favourites-style">
.fav-heart{display:inline-flex;align-items:center;justify-content:center;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid #dfe5f2;background:#fff;color:#0050ff;cursor:pointer;font-size:24px;line-height:1;box-shadow:0 2px 9px #00000012}.fav-heart[aria-pressed="true"]{color:#0050ff;background:#eaf0ff;border-color:#a9bfff}.fav-heart:focus-visible{outline:3px solid #0050ff;outline-offset:2px}.fav-inline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.fav-inline .date,.fav-inline .new{margin:0}.fav-row{display:flex;gap:10px;align-items:center;justify-content:space-between}.fav-row .fav-heart{width:34px;height:34px;font-size:19px}.favs-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.favs-card{border:1px solid #e6eaf2;border-radius:18px;overflow:hidden;background:white}.favs-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#e8efff}.favs-placeholder{aspect-ratio:16/9;background:linear-gradient(125deg,#0050ff,#00008c);display:grid;place-items:center;color:white;font-weight:900;font-size:22px}.favs-content{padding:15px}.favs-content h3{font-size:19px;margin:0 0 6px}.favs-content p{font-size:12px;color:#606879;margin:0 0 12px}.favs-ticket{display:block;background:#0050ff;color:white;border-radius:999px;padding:11px;text-align:center;text-decoration:none;font-size:12px;font-weight:900}.favs-empty{background:#f5f7ff;border:1px solid #e2e9fa;padding:20px;border-radius:18px;color:#535b70}.favs-empty p{margin:5px 0 0}.favs-note{font-size:12px;color:#677083;margin-top:10px}@media(max-width:650px){.favs-list{grid-template-columns:1fr}}
</style></head>
<script id="favourites-core">
(function(){
'use strict';
const KEY='o2-favourite-shows-v1', TOKEN_KEY='o2-favourites-private-key-v2';
const API='https://amg-favourites.sarah-tait.workers.dev/favourites';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}}
let state=read(),token=localStorage.getItem(TOKEN_KEY)||'',busy=Promise.resolve(),lastRefresh=0;
const registry=new Map();
const id=s=>String(s?.id??'').trim();
function record(s){return {id:id(s),artist:String(s.artist||''),city:String(s.city||''),venue:String(s.venues?.name||s.venue_name||s.venue||(s.city==='Liverpool'?'O2 Academy Liverpool':'')),date:String(s.event_date||s.date||'').slice(0,10),ticket_url:String(s.ticket_url||''),image_url:String(s.image_url||'')}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));changed()}
function changed(){updateHearts();window.dispatchEvent(new Event('o2-favourites-changed'))}
function active(){return Object.values(state).filter(x=>x&&!x.deleted&&x.id).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}
function isSaved(s){return !!(state[id(s)]&&!state[id(s)].deleted)}
function heart(s){const on=isSaved(s);return `<button class="fav-heart" type="button" data-fav-id="${esc(id(s))}" aria-label="${on?'Remove from':'Add to'} favourites" aria-pressed="${on}" title="${on?'Remove from favourites':'Save show'}">${on?'♥':'♡'}</button>`}
function register(s){if(!id(s))return;registry.set(id(s),s);const old=state[id(s)];if(old&&!old.deleted){const fresh=record(s);if(fresh.venue&&fresh.venue!==old.venue){state[id(s)]={...old,venue:fresh.venue};localStorage.setItem(KEY,JSON.stringify(state))}}}
function updateHearts(){document.querySelectorAll('[data-fav-id]').forEach(b=>{const on=isSaved({id:b.dataset.favId});b.textContent=on?'♥':'♡';b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Remove from favourites':'Add to favourites')})}
function fromRemote(items){const next={};for(const s of items){if(!s?.id)continue;const x=record(s);next[x.id]=x}state=next;persist()}
async function request(method,items,secret=token){const r=await fetch(API,{method,headers:{'Authorization':'Bearer '+secret,...(method==='PUT'?{'Content-Type':'application/json'}:{})},...(method==='PUT'?{body:JSON.stringify({favourites:items.map(s=>({...s,event_date:s.date||s.event_date||''}))})}:{})});if(!r.ok)throw Error('Sync failed ('+r.status+')');return r.json()}
function warn(){const el=document.getElementById('favSyncStatus');if(el)el.textContent='Could not sync right now. Please check your connection.'}
async function refresh(force=false){if(!token||(!force&&Date.now()-lastRefresh<3000))return;await busy;try{const data=await request('GET');fromRemote(data.favourites||[]);lastRefresh=Date.now()}catch(e){warn();console.warn(e)}}
function save(s){const x=record(s);if(!x.id)return false;const add=!isSaved(x);state[x.id]={...x,deleted:!add};persist();if(token){const secret=token;busy=busy.catch(()=>{}).then(async()=>{try{const data=await request('GET',null,secret);const map=new Map((data.favourites||[]).map(y=>[String(y.id),y]));if(add)map.set(x.id,{...x,event_date:x.date});else map.delete(x.id);await request('PUT',[...map.values()],secret);if(secret===token){const confirmed=await request('GET',null,secret);fromRemote(confirmed.favourites||[]);lastRefresh=Date.now()}}catch(e){warn();console.warn(e)}})}return add}
function showPanel(){const p=document.getElementById('favConnectDialog');if(!p)return;document.getElementById('favCode').value=token;document.getElementById('favSyncStatus').textContent=token?'Connected on this website. Copy this private key to connect your other pages.':'Create a private key here, or paste the key from another page.';p.showModal()}
function setToken(t){token=t;localStorage.setItem(TOKEN_KEY,t);document.getElementById('favCode').value=t;document.getElementById('favConnectBtn').textContent='♥ Favourites connected';}
function validToken(t){return /^[a-f0-9]{64}$/.test(t)}
function initUI(){const style=document.createElement('style');style.textContent=`#favConnectBtn{position:fixed;right:14px;bottom:14px;z-index:900;border:1px solid #cbd8ff;border-radius:999px;background:#fff;color:#0050ff;box-shadow:0 5px 20px #0002;padding:12px 16px;font:800 12px Arial;cursor:pointer}#favConnectDialog{border:0;border-radius:22px;width:min(460px,calc(100% - 30px));padding:24px;font-family:Arial;color:#111;box-shadow:0 20px 60px #0003}#favConnectDialog::backdrop{background:#0a1747a8}#favConnectDialog h2{font:900 25px Arial;margin:0 0 9px}#favConnectDialog p{font:14px/1.5 Arial;color:#5c6372}#favConnectDialog input{width:100%;padding:12px;border:1px solid #ccd3e0;border-radius:10px;font:12px Arial;margin:8px 0}#favConnectDialog .favActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}#favConnectDialog button{border:0;border-radius:999px;padding:11px 15px;background:#0050ff;color:white;font:800 12px Arial;cursor:pointer}#favConnectDialog button.secondary{background:#edf2ff;color:#0050ff}`;document.head.append(style);
const b=document.createElement('button');b.id='favConnectBtn';b.type='button';b.textContent=token?'♥ Favourites connected':'♡ Connect favourites';b.onclick=showPanel;document.body.append(b);
const d=document.createElement('dialog');d.id='favConnectDialog';d.innerHTML=`<h2>Connect favourites ♡</h2><p>Use the same private key on all four pages to keep your saved shows together. No sign-in needed.</p><label for="favCode" style="font:800 12px Arial">Your private connection key</label><input id="favCode" type="text" spellcheck="false" autocomplete="off" placeholder="Paste your connection key here"><div id="favSyncStatus" aria-live="polite" style="font:12px/1.5 Arial;color:#505b70"></div><div class="favActions"><button type="button" id="favGenerate">Create new key</button><button type="button" id="favConnect">Connect key</button><button type="button" class="secondary" id="favCopy">Copy key</button><button type="button" class="secondary" id="favClose">Close</button></div><p style="font-size:12px">Keep your key private: anyone with it can access your favourites. Save a copy if you want to connect another device.</p>`;document.body.append(d);
const status=document.getElementById('favSyncStatus');document.getElementById('favClose').onclick=()=>d.close();
document.getElementById('favGenerate').onclick=async()=>{if(token&&!confirm('Create a different key? Your current shared favourites will no longer be connected on this page.'))return;const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);const t=[...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');try{const existing=active();await request('PUT',existing,t);setToken(t);status.textContent='New key created and your existing favourites uploaded. Copy it to your other pages.';await refresh(true)}catch(e){status.textContent='Could not create key. Check your Worker and KV binding.'}};
document.getElementById('favConnect').onclick=async()=>{const t=document.getElementById('favCode').value.trim().toLowerCase();if(!validToken(t)){status.textContent='Please enter a valid 64-character connection key.';return}try{const data=await request('GET',null,t);if(token&&token!==t&&!confirm('Switch to this connection key?'))return;setToken(t);fromRemote(data.favourites||[]);status.textContent='Connected! Your favourites are now loaded on this page.'}catch(e){status.textContent='Connection failed. Check your key, Worker and KV binding.'}};
document.getElementById('favCopy').onclick=async()=>{const t=document.getElementById('favCode').value.trim();if(!validToken(t)){status.textContent='Create or connect a key first.';return}try{await navigator.clipboard.writeText(t);status.textContent='Copied! Paste this key into Connect favourites on your other pages.'}catch(e){document.getElementById('favCode').select();status.textContent='Select and copy the key above.'}};
if(token)refresh(true)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fav-id]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const s=registry.get(b.dataset.favId)||state[b.dataset.favId];if(s)save(s)},true);
window.addEventListener('storage',e=>{if(e.key===KEY){state=read();changed()}if(e.key===TOKEN_KEY){token=e.newValue||'';refresh(true)}});
window.addEventListener('focus',()=>refresh());document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.O2Favourites={register,heart,save,active,isSaved,updateHearts,withFavourites:url=>url,esc,refresh};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initUI);else initUI();
})();
</script><body>
<button type="button" class="backstageBack" id="backToBackstage" aria-label="Back to Backstage">← BACK TO BACKSTAGE</button>

<main>
<div class="eyebrow">Fresh on the lineup</div>
<h1>Just announced</h1>
<p class="intro">New shows have landed. See the latest gigs added near you before they slip off your radar.</p>

<div id="bar" class="locationBar hidden">
 <div><div class="locationLabel">Your location</div><div id="loc" class="locationValue"></div></div>
 <button id="change" class="change" type="button">Change</button>
</div>

<section id="picker" class="picker">
 <h2>Where do you want to see shows?</h2>
 <p>We'll remember this for your other discovery pages too.</p>
 <div id="cities" class="cities">Loading locations…</div>
</section>

<div id="loading" class="loader"></div>
<div id="note" class="note hidden"></div>
<section id="shows" class="grid" aria-live="polite"></section>
</main>

<script>
const SB="https://jiigtmxfepthdeorlnmv.supabase.co",KEY="sb_publishable_N37lWnFWPnDIRd7QBOEVpw_r13WPTyQ",LOCATION_KEY="amg_saved_location_v1";
const DAYS_NEW=7;
let all=[],selected=null;
const $=id=>document.getElementById(id);let defaultArtistImage="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dateOnly(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function parseDate(s){if(!s)return null;let d=new Date(s);return isNaN(d)?null:d}
function eventDate(s){if(!s)return"";let [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function addedLabel(s){let d=parseDate(s);if(!d)return"New";let today=new Date();today.setHours(0,0,0,0);let x=new Date(d);x.setHours(0,0,0,0);let n=Math.max(0,Math.round((today-x)/86400000));return n===0?"Added today":n===1?"Added yesterday":`Added ${n} days ago`}

function choose(c){selected=c;try{localStorage.setItem(LOCATION_KEY,c)}catch(e){};$("loc").textContent=c;$("picker").classList.add("hidden");$("bar").classList.remove("hidden");render()}
function renderCities(){let cs=[...new Set(all.map(x=>x.city).filter(Boolean))].sort();$("cities").innerHTML=cs.map(c=>`<button type="button" class="city ${selected===c?"active":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")||"<span>No locations available.</span>";$("cities").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b.dataset.c))}

function render(){
 if(!selected)return;
 let list=all.filter(s=>s.city===selected).sort((a,b)=>String(b.first_seen).localeCompare(String(a.first_seen))||String(a.event_date).localeCompare(String(b.event_date)));
 $("note").textContent=`New shows added in the last ${DAYS_NEW} days · ${selected}`;
 $("note").classList.remove("hidden");
 if(!list.length){$("shows").innerHTML=`<div class="state"><strong>No new shows here yet</strong>There haven't been any newly added shows in ${esc(selected)} in the last ${DAYS_NEW} days. Try another location.</div>`;return}
 $("shows").innerHTML=list.map(s=>{
  let imageSrc=s.image_url||defaultArtistImage;let img=imageSrc?`<img class="art" src="${esc(imageSrc)}" alt="" loading="lazy" onerror="this.style.display=\'none\'">`:`<div class="fallback">${esc(s.artist||"Live music")}</div>`;
  window.O2Favourites.register(s);return `<article class="card" data-artist="${esc(s.artist||"")}" data-city="${esc(s.city||"")}">${img}<div class="body"><div class="fav-inline"><div class="new">${esc(addedLabel(s.first_seen))}</div>${window.O2Favourites.heart(s)}</div><h2 class="artist">${esc(s.artist||"Upcoming show")}</h2><div class="meta">${eventDate(s.event_date)} · ${esc(s.city||"")}</div>${s.ticket_url?`<a class="ticket" href="${esc(s.ticket_url)}" target="_blank" rel="noopener">FIND TICKETS →</a>`:""}</div></article>`;
 }).join("");
}

async function load(){
 try{const dr=await fetch(`${SB}/rest/v1/halloween_config?show_id=eq.__settings__&select=default_artist_image_url`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});if(dr.ok){const dj=await dr.json();defaultArtistImage=dj[0]?.default_artist_image_url||""}}catch(e){}
 try{
  let rows=[],from=0,cut=new Date();cut.setDate(cut.getDate()-(DAYS_NEW-1));cut.setHours(0,0,0,0);
  const cutISO=cut.toISOString();
  while(true){
   let url=`${SB}/rest/v1/shows?select=id,artist,city,event_date,ticket_url,image_url,venue_id,first_seen&event_date=gte.${dateOnly()}&first_seen=gte.${encodeURIComponent(cutISO)}&order=first_seen.desc&offset=${from}&limit=1000`;
   let r=await fetch(url,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});
   if(!r.ok)throw Error(await r.text());
   let x=await r.json();rows.push(...x);if(x.length<1000)break;from+=1000;
  }
  all=rows;$("loading").classList.add("hidden");
  try{selected=localStorage.getItem(LOCATION_KEY)}catch(e){}
  renderCities();
  if(selected&&all.some(x=>x.city===selected)){$("loc").textContent=selected;$("picker").classList.add("hidden");$("bar").classList.remove("hidden");render()}
 }catch(e){console.error(e);$("loading").classList.add("hidden");$("picker").classList.add("hidden");$("shows").innerHTML='<div class="state"><strong>We couldn’t load new shows</strong>Please try again shortly.</div>'}
}
$("change").onclick=()=>$("picker").classList.toggle("hidden");
async function trackPageEvent(eventType,extra={}){try{await fetch(`${SB}/rest/v1/page_analytics`,{method:"POST",headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({page_name:"just_announced",event_type:eventType,...extra})})}catch(e){console.warn("Analytics event not recorded",e)}}
document.addEventListener("click",e=>{const a=e.target.closest("a.ticket");if(a){const card=a.closest(".card");trackPageEvent("ticket_click",{artist:card?.dataset?.artist||null,city:card?.dataset?.city||selected||null})}});
trackPageEvent("page_view");
load();
</script>

  if (window.history.length > 1) window.history.back();
  else window.location.href = "https://o2-show-register.pages.dev/";
