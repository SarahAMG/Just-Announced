<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Just Announced</title>
<style>
:root{--blue:#0050ff;--bg:#f5f6fa;--text:#111;--muted:#686b73;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:22px 16px 42px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
h1{font-size:34px;line-height:1.02;letter-spacing:-1.3px;margin:0 0 8px}
.intro{font-size:15px;line-height:1.45;color:var(--muted);margin:0 0 18px}
.locationBar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:20px}
.locationLabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.locationValue{font-size:16px;font-weight:800;margin-top:2px}
button{font:inherit}.change{border:0;background:#eaf0ff;color:var(--blue);font-weight:800;border-radius:999px;padding:10px 13px;min-height:42px}
.picker{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:-8px 0 20px}
.picker h2{font-size:20px;margin:0 0 5px}.picker p{font-size:13px;color:var(--muted);margin:0 0 13px}
.cities{display:flex;flex-wrap:wrap;gap:8px}.city{border:1px solid #d8dbe2;background:#fff;border-radius:999px;padding:10px 13px;font-weight:700;min-height:42px}.city.active{background:var(--blue);border-color:var(--blue);color:#fff}
.hidden{display:none!important}.note{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.art{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e9ebf0}
.fallback{aspect-ratio:16/9;background:linear-gradient(135deg,#111,#343434);display:flex;align-items:flex-end;padding:18px;color:#fff;font-weight:900;font-size:24px}
.body{padding:16px}.new{display:inline-block;background:#eaf0ff;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:6px 9px;margin-bottom:8px}
.artist{font-size:23px;line-height:1.08;font-weight:900;letter-spacing:-.5px;margin:0 0 6px}
.meta{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:14px}
.ticket{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;font-size:14px}
.state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}.state strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}
.loader{height:4px;background:#dfe5f3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.loader:after{content:"";display:block;width:42%;height:100%;background:var(--blue);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}h1{font-size:42px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">Fresh on the lineup</div>
<h1>Just announced</h1>
<p class="intro">New shows have landed. See the latest gigs added near you before they slip off your radar.</p>

<div id="bar" class="locationBar hidden">
 <div><div class="locationLabel">Your location</div><div id="loc" class="locationValue"></div></div>
 <button id="change" class="change" type="button">Change</button>
</div>

<section id="picker" class="picker">
 <h2>Where do you want to see shows?</h2>
 <p>We'll remember this for your other discovery pages too.</p>
 <div id="cities" class="cities">Loading locations…</div>
</section>

<div id="loading" class="loader"></div>
<div id="note" class="note hidden"></div>
<section id="shows" class="grid" aria-live="polite"></section>
</main>

<script>
const SB="https://jiigtmxfepthdeorlnmv.supabase.co",KEY="sb_publishable_N37lWnFWPnDIRd7QBOEVpw_r13WPTyQ",LOCATION_KEY="amg_saved_location_v1";
const DAYS_NEW=14;
let all=[],selected=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dateOnly(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function parseDate(s){if(!s)return null;let d=new Date(s);return isNaN(d)?null:d}
function eventDate(s){if(!s)return"";let [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function addedLabel(s){let d=parseDate(s);if(!d)return"New";let today=new Date();today.setHours(0,0,0,0);let x=new Date(d);x.setHours(0,0,0,0);let n=Math.max(0,Math.round((today-x)/86400000));return n===0?"Added today":n===1?"Added yesterday":`Added ${n} days ago`}

function choose(c){selected=c;try{localStorage.setItem(LOCATION_KEY,c)}catch(e){};$("loc").textContent=c;$("picker").classList.add("hidden");$("bar").classList.remove("hidden");render()}
function renderCities(){let cs=[...new Set(all.map(x=>x.city).filter(Boolean))].sort();$("cities").innerHTML=cs.map(c=>`<button type="button" class="city ${selected===c?"active":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")||"<span>No locations available.</span>";$("cities").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b.dataset.c))}

function render(){
 if(!selected)return;
 let list=all.filter(s=>s.city===selected).sort((a,b)=>String(b.first_seen).localeCompare(String(a.first_seen))||String(a.event_date).localeCompare(String(b.event_date)));
 $("note").textContent=`New shows added in the last ${DAYS_NEW} days · ${selected}`;
 $("note").classList.remove("hidden");
 if(!list.length){$("shows").innerHTML=`<div class="state"><strong>No new shows here yet</strong>There haven't been any newly added shows in ${esc(selected)} in the last ${DAYS_NEW} days. Try another location.</div>`;return}
 $("shows").innerHTML=list.map(s=>{
  let img=s.image_url?`<img class="art" src="${esc(s.image_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<div class="fallback">${esc(s.artist||"Live music")}</div>`;
  return `<article class="card">${img}<div class="body"><div class="new">${esc(addedLabel(s.first_seen))}</div><h2 class="artist">${esc(s.artist||"Upcoming show")}</h2><div class="meta">${eventDate(s.event_date)}<br>${esc(s.venues?.name || s.city || "")}${s.venues?.name && s.city ? " · "+esc(s.city) : ""}</div>${s.ticket_url?`<a class="ticket" href="${esc(s.ticket_url)}" target="_blank" rel="noopener">FIND TICKETS →</a>`:""}</div></article>`;
 }).join("");
}

async function load(){
 try{
  let rows=[],from=0,cut=new Date();cut.setDate(cut.getDate()-(DAYS_NEW-1));cut.setHours(0,0,0,0);
  const cutISO=cut.toISOString();
  while(true){
   let url=`${SB}/rest/v1/shows?select=id,artist,city,event_date,ticket_url,image_url,venue_id,first_seen,venues(name)&event_date=gte.${dateOnly()}&first_seen=gte.${encodeURIComponent(cutISO)}&order=first_seen.desc&offset=${from}&limit=1000`;
   let r=await fetch(url,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});
   if(!r.ok)throw Error(await r.text());
   let x=await r.json();rows.push(...x);if(x.length<1000)break;from+=1000;
  }
  all=rows;$("loading").classList.add("hidden");
  try{selected=localStorage.getItem(LOCATION_KEY)}catch(e){}
  renderCities();
  if(selected&&all.some(x=>x.city===selected)){$("loc").textContent=selected;$("picker").classList.add("hidden");$("bar").classList.remove("hidden");render()}
 }catch(e){console.error(e);$("loading").classList.add("hidden");$("picker").classList.add("hidden");$("shows").innerHTML='<div class="state"><strong>We couldn’t load new shows</strong>Please try again shortly.</div>'}
}
$("change").onclick=()=>$("picker").classList.toggle("hidden");
load();
</script>
</body></html>
